<!doctype html>
<!-- version 2.2    -->
<!-- =============================================================================
     PAGE DETAIL VIEW
     =============================================================================
     Renders individual markdown pages with extensible styling support.

     Style Priority:
     1. Front matter 'style:' key (highest priority)
     2. Category default from PAGE_CONFIG
     3. 'tailwind' (fallback)

     Read Mode:
     Front matter 'read-mode: true' constrains content to 720px width centered,
     optimized for reading long prose. Defaults to false if not present.

     Edit Mode:
     Admin users can view/edit the raw markdown via the rm-markdown-editor modal.

     The style system is fully extensible - adding new styles requires:
     1. Creating a CSS file in /styles/md-styles/
     2. Adding entry to STYLE_REGISTRY in server.js
     3. Using the style name in PAGE_CONFIG or front matter
     ============================================================================= -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Base Styles -->
    <link rel="stylesheet" href="/styles/output.css" />
    <link rel="stylesheet" href="/styles/rm.css" />

    <!-- Syntax Highlighting -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />

    <!-- Client Components -->
    <script type="module" src="/components/client-components.js"></script>

    <rm-head page-title="{{PAGE_TITLE_ATTR}}"></rm-head>

    <style>
      /* =========================================================================
       * BASE STYLES - Always applied to markdown content container
       * ========================================================================= */
      #markdown-content {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 100%;
        margin: 0 auto;
        /* Only set vertical padding - let themes control horizontal padding */
        padding-top: 1rem;
        padding-bottom: 0;
      }

      /* =========================================================================
       * READ MODE - Narrower width for long prose content
       * Enabled via front matter: read-mode: true
       * ========================================================================= */
      #markdown-content.read-mode {
        max-width: 720px;
        margin: 0 auto;
      }

      /* =========================================================================
       * CODE COPY BUTTON STYLES
       * ========================================================================= */
      .code-wrapper {
        position: relative;
      }

      .copy-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #d1d9e0;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 12px;
        color: #656d76;
        cursor: pointer;
        transition: all 0.2s;
        display: none;
        z-index: 10;
      }

      .code-wrapper:hover .copy-btn {
        display: block;
      }

      .copy-btn:hover {
        background: #fff;
        color: #1f2937;
        border-color: #9ca3af;
      }

      .copy-btn.copied {
        background: #10b981;
        color: white;
        border-color: #10b981;
      }

      /* =========================================================================
       * SIDEBAR MOBILE TOGGLE
       * ========================================================================= */
      @media (max-width: 768px) {
        #sidebar-content {
          max-height: 0;
          overflow: hidden;
          transition: max-height 0.3s ease-out;
        }

        #sidebar-content.block {
          max-height: 80vh;
          overflow-y: auto;
        }
      }

      /* =========================================================================
       * PRINT STYLES - Hide non-essential elements
       * ========================================================================= */
      @media print {
        /* Hide navigation and controls */
        rm-nav-header,
        rm-footer,
        #sidebar-col,
        #btn-print,
        #edit-links,
        .code-wrapper .copy-btn,
        #top-back-link {
          display: none !important;
        }

        /* Reset layout for print */
        body {
          background: white !important;
        }

        main {
          width: 100% !important;
          padding: 0 !important;
        }

        #page-header {
          border-bottom: 1px solid #ccc !important;
        }

        article {
          break-inside: avoid;
        }

        pre,
        code {
          white-space: pre-wrap !important;
          word-wrap: break-word !important;
        }

        /* Remove padding for print */
        .px-6,
        .md\:px-12 {
          padding-left: 0 !important;
          padding-right: 0 !important;
        }
      }

      /* A4 Page setup */
      @page {
        size: A4;
        margin: 2cm 2.5cm;
      }
    </style>
  </head>
  <body class="bg-primary-50 flex min-h-screen flex-col">
    <rm-default-container class="flex grow flex-col">
      <rm-nav-header class="block shrink-0"></rm-nav-header>

      <div id="layout-wrapper" class="relative flex w-full grow flex-col items-start md:flex-row">
        <!-- Sidebar Column (shown for categories with sidebar: true) -->
        <aside
          id="sidebar-col"
          class="border-primary-200 hidden w-full shrink-0 self-stretch border-r bg-gray-50/50 md:sticky md:top-0 md:h-auto md:min-h-[calc(100vh-64px)] md:w-56"
        >
          <div
            id="mobile-menu-trigger"
            class="border-primary-100 bg-primary-50 flex cursor-pointer items-center justify-between border-b p-4 md:hidden"
            onclick="toggleMobileMenu()"
          >
            <span class="text-primary-500 text-xs font-bold uppercase">Menu</span>
          </div>
          <div class="hidden overflow-y-auto p-4 md:block" id="sidebar-content">
            <div class="mb-6">
              <a
                id="sidebar-back-link"
                href="#"
                class="group text-primary-500 hover:text-primary-700 flex items-center gap-2 text-xs font-bold tracking-wide uppercase"
              >
                <div
                  class="border-primary-200 group-hover:border-primary-400 flex h-6 w-6 items-center justify-center rounded-full border bg-white transition-colors"
                >
                  <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M10 19l-7-7m0 0l7-7m-7 7h18"
                    ></path>
                  </svg>
                </div>
                Back to list
              </a>
            </div>
            <nav id="nav-tree" class="flex flex-col gap-1 text-sm">
              <div class="animate-pulse space-y-2">
                <div class="bg-primary-100 h-4 w-3/4 rounded"></div>
                <div class="bg-primary-50 h-4 w-full rounded"></div>
              </div>
            </nav>
          </div>
        </aside>

        <main class="w-full min-w-0 grow bg-white pb-12">
          <article>
            <!-- Page Header -->
            <div id="page-header" class="border-primary-100 border-b px-6 pt-8 pb-4 md:px-12">
              <a
                id="top-back-link"
                href="#"
                class="text-primary-500 hover:text-primary-700 mb-4 hidden text-sm font-medium"
                >&larr; Back to list</a
              >
              <div class="flex items-start justify-between gap-4">
                <h1
                  id="page-title"
                  class="text-primary-800 mb-3 text-3xl leading-tight font-bold tracking-tight md:text-4xl"
                >
                  {{PAGE_TITLE_TEXT}}
                </h1>
                <button
                  id="btn-print"
                  onclick="window.print()"
                  class="text-primary-500 hover:text-primary-700 border-primary-200 hover:bg-primary-50 mt-1 inline-flex items-center gap-1.5 rounded border bg-white px-3 py-1.5 text-sm font-medium shadow-sm transition-colors"
                  title="Print this page"
                >
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"
                    ></path>
                  </svg>
                  <span>Print</span>
                </button>
              </div>
              <div class="text-primary-500 mt-2 flex flex-wrap items-center gap-4 text-sm">
                <span id="page-date" class="flex items-center gap-1 font-mono text-xs"
                  >{{PAGE_DATE}}</span
                >
                <span
                  id="private-badge"
                  class="hidden rounded-full border border-amber-200 bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-800"
                  >Private</span
                >
                <!-- Admin Edit Links (hidden by default, shown if user is admin) -->
                <span id="edit-links" class="text-primary-400 hidden text-xs">
                  <button
                    onclick="window.openPageEditor('view')"
                    class="hover:text-primary-600 transition-colors hover:underline"
                    title="View raw markdown"
                  >
                    view
                  </button>
                  <span class="text-primary-300">|</span>
                  <button
                    onclick="window.openPageEditor('edit')"
                    class="hover:text-secondary-600 transition-colors hover:underline"
                    title="Edit markdown"
                  >
                    edit
                  </button>
                </span>
              </div>
            </div>

            <!-- Markdown Content Container -->
            <div class="mt-6 px-6 md:px-12">
              <div id="status-container" class="mb-4 hidden"></div>
              <!--
                The class attribute here will be dynamically replaced by the server
                based on the effective style. The server injects the appropriate
                wrapper classes from STYLE_REGISTRY.
              -->
              <div
                id="markdown-content"
                class="prose prose-slate prose-pre:bg-transparent prose-code:before:content-none prose-code:after:content-none max-w-none"
              >
                <!--MARKDOWN_CONTENT-->
              </div>
            </div>
          </article>
        </main>
      </div>
      <rm-footer></rm-footer>
    </rm-default-container>

    <!-- Editor Modal Container -->
    <div id="editor-container"></div>

    <!-- =========================================================================
         INITIALIZATION SCRIPT - Sidebar visibility
         ========================================================================= -->
    <script>
      ;(function () {
        // Get server-injected configuration
        var config = window.SERVER_PAGES_CONFIG || []
        var pathParts = window.location.pathname.split('/').filter(function (p) {
          return p
        })
        var category = pathParts.length >= 2 ? pathParts[1] : ''

        // Find current category configuration
        var currentCat = config.find(function (c) {
          return c.name === category
        })
        var hasSidebar = currentCat && currentCat.sidebar

        // Toggle sidebar visibility
        var sidebarCol = document.getElementById('sidebar-col')
        var topBackLink = document.getElementById('top-back-link')

        if (hasSidebar) {
          if (sidebarCol) sidebarCol.classList.remove('hidden')
          if (topBackLink) topBackLink.classList.add('hidden')
        } else {
          if (sidebarCol) sidebarCol.remove()
          if (topBackLink) topBackLink.classList.remove('hidden')
        }
      })()
    </script>

    <!-- Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- =========================================================================
         MAIN PAGE SCRIPT
         ========================================================================= -->
    <script>
      document.addEventListener('DOMContentLoaded', init)

      // Parse URL path
      var pathParts = window.location.pathname.split('/').filter(function (p) {
        return p
      })
      var category = pathParts.length >= 2 ? pathParts[1] : ''
      var slug = pathParts.length >= 3 ? pathParts[2] : ''

      // DOM references
      var navTree = document.getElementById('nav-tree')
      var sidebarBackLink = document.getElementById('sidebar-back-link')
      var topBackLink = document.getElementById('top-back-link')
      var contentEl = document.getElementById('markdown-content')
      var editLinksEl = document.getElementById('edit-links')

      // Auth state
      var isAdmin = false

      // Editor state
      var editorOpen = false
      var editorMode = 'view'

      // ==========================================================================
      // INITIALIZATION
      // ==========================================================================

      /**
       * Initialize page
       */
      async function init() {
        // Set back links
        if (category) {
          var listUrl = '/pages/' + category
          if (sidebarBackLink) sidebarBackLink.href = listUrl
          if (topBackLink) {
            topBackLink.href = listUrl
            topBackLink.textContent = '\u2190 Back to ' + category
          }
        }

        // Load sidebar if needed
        var config = window.SERVER_PAGES_CONFIG || []
        var currentCat = config.find(function (c) {
          return c.name === category
        })
        if (currentCat && currentCat.sidebar) {
          loadSidebarLinks()
        }

        // Handle content - SSR or client-side
        if (!window.SSR_DATA) {
          // No SSR data - load via API (shouldn't happen in normal flow)
          loadPageContent()
        } else {
          // SSR provided content - just enhance it
          contentEl.querySelectorAll('pre code').forEach(function (el) {
            hljs.highlightElement(el)
          })
          addCopyButtons()

          // Apply read-mode if enabled in front matter
          if (window.SSR_DATA.readMode) {
            contentEl.classList.add('read-mode')
          }
        }

        // Check session and show edit links if admin
        await checkSession()
        if (isAdmin && editLinksEl) {
          editLinksEl.classList.remove('hidden')
        }

        // Hot reload support
        if (window.EventSource) {
          var evtSource = new EventSource('/api/hot-reload')
          evtSource.onmessage = function (e) {
            if (e.data === 'reload') window.location.reload()
          }
        }
      }

      // ==========================================================================
      // SESSION MANAGEMENT
      // ==========================================================================

      /**
       * Check current session and determine if user is admin
       * Uses direct fetch to better-auth session endpoint
       */
      async function checkSession() {
        try {
          const response = await fetch('/api/auth/get-session', {
            method: 'GET',
            credentials: 'include', // Important: include cookies for session
          })

          if (!response.ok) {
            isAdmin = false
            return
          }

          const data = await response.json()

          if (data && data.user) {
            isAdmin = data.user.role === 'admin'
          } else {
            isAdmin = false
          }
        } catch (err) {
          console.error('Session check failed:', err)
          isAdmin = false
        }
      }

      // ==========================================================================
      // EDITOR MODAL MANAGEMENT
      // ==========================================================================

      /**
       * Open the markdown editor modal
       * @param {string} mode - 'view' or 'edit'
       */
      function openEditor(mode) {
        editorOpen = true
        editorMode = mode || 'view'
        renderEditor()
      }

      /**
       * Close the markdown editor modal
       */
      function closeEditor() {
        editorOpen = false
        editorMode = 'view'
        renderEditor()
      }

      /**
       * Handle save event from editor - reload page to reflect changes
       */
      function handleEditorSaved(e) {
        console.log('File saved:', e.detail)
        // Reload the page to show updated content
        window.location.reload()
      }

      /**
       * Render the editor modal (or clear it if closed)
       */
      function renderEditor() {
        var container = document.getElementById('editor-container')
        if (!editorOpen) {
          container.innerHTML = ''
          return
        }

        // Create the editor element
        container.innerHTML = `
          <rm-markdown-editor
            id="md-editor"
            category="${category}"
            slug="${slug}"
            mode="${editorMode}"
          ></rm-markdown-editor>
        `

        // Get reference and set properties
        var editor = document.getElementById('md-editor')
        editor.isOpen = true
        editor.category = category
        editor.slug = slug
        editor.mode = editorMode

        // Add event listeners
        editor.addEventListener('close', closeEditor)
        editor.addEventListener('saved', handleEditorSaved)
      }

      // ==========================================================================
      // SIDEBAR & NAVIGATION
      // ==========================================================================

      /**
       * Load sidebar navigation links
       */
      function loadSidebarLinks() {
        if (!navTree) return
        fetch('/api/pages/list/' + category)
          .then(function (res) {
            if (!res.ok) throw new Error('Failed')
            return res.json()
          })
          .then(function (data) {
            var pages = data.pages || []
            var html = ''
            pages.forEach(function (p) {
              var isActive = p.slug === slug
              var baseClass =
                'block py-1.5 px-3 rounded text-sm transition-colors duration-200 leading-snug'
              var activeClass =
                'bg-white text-primary-700 font-bold shadow-sm ring-1 ring-primary-100'
              var inactiveClass = 'text-gray-600 hover:bg-white hover:text-primary-700'
              html +=
                '<a href="/pages/' +
                category +
                '/' +
                p.slug +
                '" class="' +
                baseClass +
                ' ' +
                (isActive ? activeClass : inactiveClass) +
                '">' +
                (p.title || 'Untitled') +
                '</a>'
            })
            navTree.innerHTML = html
          })
          .catch(function (e) {
            console.error('Sidebar load error:', e)
          })
      }

      // ==========================================================================
      // CONTENT LOADING (FALLBACK FOR NON-SSR)
      // ==========================================================================

      /**
       * Load page content via API (fallback if SSR not available)
       * Uses the extensible style system from the server response
       */
      function loadPageContent() {
        fetch('/api/pages/content/' + category + '/' + slug)
          .then(function (res) {
            if (!res.ok) throw new Error('Failed to fetch content')
            return res.json()
          })
          .then(function (data) {
            // Update title
            document.getElementById('page-title').textContent = data.meta.title

            // Update content
            contentEl.innerHTML = data.html

            // Apply style classes using server-provided style config
            applyStyleClasses(data.style)

            // Syntax highlighting
            contentEl.querySelectorAll('pre code').forEach(function (el) {
              hljs.highlightElement(el)
            })

            // Add copy buttons
            addCopyButtons()

            // Load style CSS if needed
            if (data.style && data.style.cssFile) {
              loadStyleCss(data.style.cssFile)
            }

            // Apply read-mode if enabled in front matter
            if (data.meta && data.meta.readMode) {
              contentEl.classList.add('read-mode')
            }
          })
          .catch(function (e) {
            console.error('Content load error:', e)
          })
      }

      // ==========================================================================
      // STYLE MANAGEMENT
      // ==========================================================================

      /**
       * Apply style classes to the content container
       * Uses the style configuration from the server
       * @param {Object} styleConfig - Style configuration object
       */
      function applyStyleClasses(styleConfig) {
        if (!styleConfig) return

        // Get all registered style wrapper classes to remove
        var registry = window.STYLE_REGISTRY || {}
        var allStyleClasses = []

        Object.values(registry).forEach(function (style) {
          if (style.wrapperClass) {
            style.wrapperClass.split(' ').forEach(function (cls) {
              if (cls) allStyleClasses.push(cls)
            })
          }
        })

        // Add default prose classes to removal list
        allStyleClasses.push('prose', 'prose-slate', 'max-w-none')

        // Remove all style classes
        allStyleClasses.forEach(function (cls) {
          contentEl.classList.remove(cls)
        })

        // Add the new style's wrapper classes
        if (styleConfig.wrapperClass) {
          styleConfig.wrapperClass.split(' ').forEach(function (cls) {
            if (cls) contentEl.classList.add(cls)
          })
        }

        // If not removing prose, add prose back
        if (!styleConfig.removeProse) {
          contentEl.classList.add('prose', 'prose-slate', 'max-w-none')
        }
      }

      /**
       * Dynamically load a style CSS file
       * @param {string} cssFile - CSS filename in /styles/md-styles/
       */
      function loadStyleCss(cssFile) {
        var cssPath = '/styles/md-styles/' + cssFile

        // Check if already loaded
        var existing = document.querySelector('link[href="' + cssPath + '"]')
        if (existing) return

        // Create and append link element
        var link = document.createElement('link')
        link.rel = 'stylesheet'
        link.href = cssPath
        document.head.appendChild(link)
      }

      // ==========================================================================
      // CODE COPY BUTTONS
      // ==========================================================================

      /**
       * Add copy buttons to code blocks
       */
      function addCopyButtons() {
        if (!contentEl) return
        var codeBlocks = contentEl.querySelectorAll('pre')
        codeBlocks.forEach(function (pre) {
          // Skip if already wrapped
          if (pre.parentNode.classList.contains('code-wrapper')) return

          var wrapper = document.createElement('div')
          wrapper.className = 'code-wrapper'
          pre.parentNode.insertBefore(wrapper, pre)
          wrapper.appendChild(pre)

          var btn = document.createElement('button')
          btn.className = 'copy-btn'
          btn.textContent = 'Copy'
          btn.addEventListener('click', function () {
            var codeEl = pre.querySelector('code')
            var code = codeEl ? codeEl.innerText : pre.innerText
            navigator.clipboard
              .writeText(code)
              .then(function () {
                btn.textContent = 'Copied!'
                btn.classList.add('copied')
                setTimeout(function () {
                  btn.textContent = 'Copy'
                  btn.classList.remove('copied')
                }, 2000)
              })
              .catch(function (err) {
                console.error('Copy failed:', err)
              })
          })
          wrapper.appendChild(btn)
        })
      }

      // ==========================================================================
      // GLOBAL FUNCTIONS (exposed to window)
      // ==========================================================================

      /**
       * Toggle mobile menu visibility
       */
      window.toggleMobileMenu = function () {
        var content = document.getElementById('sidebar-content')
        if (content) content.classList.toggle('hidden')
      }

      /**
       * Open the page editor modal
       * @param {string} mode - 'view' or 'edit'
       */
      window.openPageEditor = openEditor
    </script>
  </body>
</html>
